name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio ruff

      - name: Lint with Ruff
        run: ruff check backend/app

      - name: Run Backend Syntax Check
        run: python -m py_compile backend/app/*.py backend/app/routes/*.py

      - name: Run Pytest
        run: |
          cd backend
          pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install Dependencies
        run: |
          cd frontend
          pnpm install

      - name: Run Vitest
        run: |
          cd frontend
          npx vitest run

      - name: Lint
        run: |
          cd frontend
          pnpm run lint

      - name: Typecheck
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build Next.js
        run: |
          cd frontend
          NEXT_PUBLIC_BACKEND_URL=http://localhost:8000 pnpm run build

  gatekeeper:
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: echo "All CI checks passed"